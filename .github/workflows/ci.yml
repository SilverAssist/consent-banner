name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    # tsdown requires Node ^22.18.0 || >=24.11.0, so Node 20 cannot build this
    # package at all. engines declares >=22.0.0 to match what CI verifies.
    name: Code Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npm run lint
      
      - name: Build package
        run: npm run build
      
      - name: Run tests
        run: npm test
      
      - name: Create summary
        if: success()
        run: |
          echo "## ✅ All Quality Checks Passed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Type checking (TypeScript)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build successful" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests passed" >> $GITHUB_STEP_SUMMARY

  integration:
    # Consumes the *packed tarball* from a real Next.js app, which is the only
    # way three defects found in this org were visible: a missing "use client"
    # directive (fails only when a Server Component imports the built file), an
    # `exports` map pointing at files the build never produced, and and a documented
    # ./styles export pointing at a file the build never emitted (the missing
    # ./styles stylesheet). No unit test can see any of
    # them.
    name: Next.js integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build fixture against the packed tarball
        run: npm run e2e:setup

      - name: Run integration specs
        run: npx playwright test -c e2e/playwright.config.ts

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: e2e/test-results/
          retention-days: 7

